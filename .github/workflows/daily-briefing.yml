name: Daily Geopolitics & Markets Briefing

on:
  schedule:
    # 23:00 UTC = 07:00 Asia/Manila (no DST in the Philippines)
    - cron: '0 23 * * *'
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: daily-briefing
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Ensure ffmpeg is available
        run: |
          if ! command -v ffmpeg >/dev/null 2>&1; then
            sudo apt-get update -y
            sudo apt-get install -y ffmpeg
          fi

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Generate today's briefing
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          PODCAST_BASE_URL: ${{ vars.PODCAST_BASE_URL }}
        run: python scripts/run_pipeline.py

      - name: Commit and push new episode
        run: |
          git config user.name "briefing-bot"
          git config user.email "actions@users.noreply.github.com"
          git add docs/
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Daily briefing for $(TZ=Asia/Manila date +'%Y-%m-%d')"
            git push
          fi
